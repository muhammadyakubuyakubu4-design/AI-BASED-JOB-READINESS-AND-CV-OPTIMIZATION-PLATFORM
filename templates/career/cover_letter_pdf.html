<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 1in; }
  body { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 11pt; line-height: 1.6; color: #000; }
  h2 { font-size: 16pt; margin-bottom: 4px; }
  .company { font-size: 12pt; color: #555; margin-bottom: 20px; }
  .content { white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>Cover Letter — {{ letter.job_title }}</h2>
  {% if letter.company_name %}<div class="company">{{ letter.company_name }}</div>{% endif %}
  <div class="content">{{ letter.content|linebreaksbr }}</div>
</body>
</html>
