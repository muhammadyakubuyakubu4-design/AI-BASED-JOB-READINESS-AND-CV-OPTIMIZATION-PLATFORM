<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — CareerAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  {% load static %}<link rel="stylesheet" href="{% static 'css/main.css' %}" />
</head>
<body class="auth-body">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-form-container" style="max-width:420px;width:100%">
    <div class="text-center mb-4">
      <div class="auth-icon-circle mx-auto mb-3"><i class="fas fa-key"></i></div>
      <h2 class="auth-title">Reset Password</h2>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
    </div>
    <form method="POST">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          {{ form.email }}
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 btn-auth"><i class="fas fa-paper-plane me-2"></i>Send Reset Link</button>
    </form>
    <p class="text-center mt-3"><a href="{% url 'authentication:login' %}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Login</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
