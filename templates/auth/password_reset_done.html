<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Sent — CareerAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  {% load static %}<link rel="stylesheet" href="{% static 'css/main.css' %}" />
</head>
<body class="auth-body">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-form-container text-center" style="max-width:420px;width:100%">
    <div class="auth-success-icon mx-auto mb-3"><i class="fas fa-envelope-circle-check"></i></div>
    <h2 class="auth-title">Check Your Email</h2>
    <p class="auth-subtitle">We've sent password reset instructions to your email address. Please check your inbox.</p>
    <a href="{% url 'authentication:login' %}" class="btn btn-success w-100 btn-auth mt-3"><i class="fas fa-arrow-left me-2"></i>Back to Login</a>
  </div>
</div>
</body></html>
