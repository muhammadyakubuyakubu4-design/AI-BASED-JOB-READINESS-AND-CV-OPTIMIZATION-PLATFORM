<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — CareerAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  {% load static %}<link rel="stylesheet" href="{% static 'css/main.css' %}" />
</head>
<body class="auth-body">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-form-container" style="max-width:420px;width:100%">
    <div class="text-center mb-4">
      <div class="auth-icon-circle mx-auto mb-3"><i class="fas fa-lock"></i></div>
      <h2 class="auth-title">Set New Password</h2>
    </div>
    <form method="POST">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          {{ form.new_password1 }}
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          {{ form.new_password2 }}
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 btn-auth"><i class="fas fa-check me-2"></i>Set New Password</button>
    </form>
  </div>
</div>
</body></html>
